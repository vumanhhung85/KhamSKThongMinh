<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chụp phiếu — Trạm Y Tế Linh Xuân</title>
<style>
  :root{
    --blue:#1a56db; --blue-dark:#1442a8; --bg:#0e1116; --panel:#171b22; --panel2:#1f242e;
    --line:#2a303c; --text:#e8ebf0; --muted:#8b93a3; --warn:#f5a623; --danger:#e5484d; --good:#2fb170;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;}
  header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px;}
  header .case-counter{font-size:12px;color:var(--muted);}

  #cameraWrap{position:relative;background:#000;width:100%;aspect-ratio:3/4;max-height:62vh;overflow:hidden;}
  #video{width:100%;height:100%;object-fit:cover;display:block;}
  #cameraMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:14px;line-height:1.5;}
  #shutterRow{position:absolute;bottom:16px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:28px;}
  #btnShutter{width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.35);cursor:pointer;}
  #btnShutter:active{background:#ddd;}
  #btnShutter:disabled{background:#9aa3b2;border-color:rgba(255,255,255,.2);cursor:wait;}
  #btnSwitchCam{width:44px;height:44px;border-radius:50%;background:rgba(20,22,28,.55);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:18px;cursor:pointer;}
  .count-badge{position:absolute;top:12px;right:12px;background:rgba(20,22,28,.7);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:13px;padding:4px 10px;border-radius:20px;}
  #detectOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  #autoToggleWrap,#hiresToggleWrap{font-size:12px;user-select:none;}
  #autoToggleWrap input,#hiresToggleWrap input{accent-color:var(--blue);width:14px;height:14px;}
  /* Dòng trạng thái tấm vừa chụp: độ phân giải thật + có tự cắt được không. Nhìn dòng này là biết
     ngay ảnh có đủ nét không, khỏi phải xuất PDF ra mới phát hiện. */
  #capStatus{position:absolute;left:12px;right:12px;bottom:100px;font-size:11px;color:#dfe5ee;background:rgba(20,22,28,.68);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 9px;line-height:1.45;display:none;}
  #capStatus b{color:#fff;font-weight:600;}
  #capStatus .bad{color:#ffcf8a;}

  #fallbackRow{padding:10px 16px;border-bottom:1px solid var(--line);}
  #fallbackRow label{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer;}
  #fallbackRow input[type=file]{display:none;}

  #caseSection{padding:14px 16px 90px;}
  #caseNameRow{display:flex;gap:8px;margin-bottom:12px;}
  #caseNameRow input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;}
  #caseNameRow input::placeholder{color:var(--muted);}

  #thumbGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:16px;}
  .thumb{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .idx{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;}
  .thumb .px{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#cfe3ff;font-size:9px;padding:1px 5px;border-radius:10px;}
  .thumb .actions{position:absolute;bottom:0;left:0;right:0;display:flex;background:rgba(0,0,0,.55);}
  .thumb .actions button{flex:1;background:none;border:none;color:#fff;font-size:14px;padding:6px 0;cursor:pointer;border-right:1px solid rgba(255,255,255,.15);}
  .thumb .actions button:last-child{border-right:none;}
  .thumb .actions button:active{background:rgba(255,255,255,.15);}
  #emptyHint{color:var(--muted);font-size:13px;text-align:center;padding:24px 0;}

  #bottomBar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(14,17,22,0),var(--bg) 30%);display:flex;gap:10px;z-index:15;}
  .btn{border:none;border-radius:10px;padding:13px 16px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary{flex:1;background:var(--blue);color:#fff;}
  .btn-primary:disabled{background:#334066;color:#7f8aa8;cursor:not-allowed;}
  .btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}

  /* Modal sửa ảnh (xoay / cắt) */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;flex-direction:column;}
  .modal-overlay.show{display:flex;}
  .modal-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff;}
  .modal-top button{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;padding:8px;}
  #editStage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;}
  #editCanvas{max-width:100%;max-height:100%;touch-action:none;}
  .crop-handle{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;background:#fff;border:2px solid var(--blue);touch-action:none;}
  .modal-bottom{display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));}
  .modal-bottom .btn{flex:1;}
  #editHint{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 6px;}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:8px;font-size:13px;z-index:80;box-shadow:0 4px 14px rgba(0,0,0,.4);max-width:88vw;text-align:center;}
</style>
</head>
<body>

<header>
  <h1>📷 Chụp phiếu khám</h1>
  <div class="case-counter" id="sessionCounter">Đã xuất 0 ca trong phiên này</div>
</header>

<div id="cameraWrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="detectOverlay"></canvas>
  <div id="cameraMsg"></div>
  <div class="count-badge" id="countBadge" style="display:none;">0 ảnh</div>
  <label class="count-badge" id="autoToggleWrap" style="left:12px;right:auto;display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="autoDetectToggle" checked style="margin:0;"> <span id="autoToggleLabel">Tự động cắt</span>
  </label>
  <label class="count-badge" id="hiresToggleWrap" style="left:12px;right:auto;top:44px;display:flex;align-items:center;gap:6px;cursor:pointer;">
    <input type="checkbox" id="hiresToggle" checked style="margin:0;"> <span id="hiresToggleLabel">Chụp nét cao</span>
  </label>
  <button class="count-badge" id="btnDebugInfo" style="left:12px;right:auto;top:76px;font-size:11px;padding:3px 8px;">ℹ️ Xem trạng thái</button>
  <div id="capStatus"></div>
  <div id="shutterRow">
    <button id="btnSwitchCam" title="Đổi camera">⟲</button>
    <button id="btnShutter" title="Chụp"></button>
    <div style="width:44px;"></div>
  </div>
</div>

<div id="fallbackRow">
  <label>📁 Không mở được camera? Chọn/chụp ảnh kiểu khác
    <input type="file" id="fileFallback" accept="image/*" capture="environment" multiple>
  </label>
</div>

<div id="caseSection">
  <div id="caseNameRow">
    <input type="text" id="caseNameInput" placeholder="Tên/mã ca (để trống thì tự đặt tên theo giờ chụp)">
  </div>
  <div id="thumbGrid"></div>
  <div id="emptyHint">Chưa có ảnh nào — bấm nút chụp ở trên để bắt đầu 1 ca mới.</div>
</div>

<div id="bottomBar">
  <button class="btn btn-secondary" id="btnClearCase">Xoá hết ca này</button>
  <button class="btn btn-primary" id="btnExportCase" disabled>Xong ca này — Xuất PDF</button>
</div>

<!-- Modal sửa ảnh: xoay + cắt (kéo 4 góc) -->
<div class="modal-overlay" id="editModal">
  <div class="modal-top">
    <button id="btnEditCancel">Huỷ</button>
    <span>Sửa ảnh</span>
    <button id="btnEditRotateL" title="Xoay trái">↺</button>
  </div>
  <div id="editStage">
    <canvas id="editCanvas"></canvas>
  </div>
  <div id="editHint">Kéo 4 góc để cắt gọt phần thừa quanh tờ phiếu (không bắt buộc).</div>
  <div class="modal-bottom">
    <button class="btn btn-secondary" id="btnEditReset">Bỏ cắt (giữ nguyên ảnh)</button>
    <button class="btn btn-primary" id="btnEditDone">Xong</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- jscanify (MIT, ~1.8k sao trên GitHub: github.com/puffinsoft/jscanify) — thư viện dò cạnh tờ
     giấy + cắt phối cảnh mã nguồn mở. Nhẹ (vài chục KB, không phải WASM) nên tải chặn bình thường
     (không async). Bản thân file chỉ ĐĂNG KÝ biến toàn cục `jscanify`, chưa đụng vào `cv` — nên
     load trước hay sau lúc OpenCV.js (bên dưới) chạy xong đều được, không phải chờ nhau. -->
<script src="https://cdn.jsdelivr.net/gh/ColonelParrot/jscanify@v1.4.0/src/jscanify.min.js"></script>
<script>
// OpenCV.js dùng để tự dò 4 góc tờ phiếu (giống viền xanh của CamScanner).
// File khá nặng (~10MB) nên tải async — trong lúc chưa tải xong (hoặc nếu tải lỗi hẳn), app vẫn
// dùng bình thường, chỉ là chưa có viền xanh + chưa tự cắt lúc chụp (vẫn chụp được, vẫn cắt tay
// bằng nút ✎ như cũ).
//
// LƯU Ý QUAN TRỌNG đã rút kinh nghiệm: các bản OpenCV.js đóng gói lại (mirror qua npm/jsDelivr)
// có thể KHÔNG dùng đúng kiểu báo hiệu "đã sẵn sàng" `Module.onRuntimeInitialized` như bản chính
// thức (VD @techstark/opencv-js đời mới dùng kiểu module ES khác hẳn) — nếu chỉ dựa vào đúng 1
// kiểu tín hiệu đó, có bản tải xong hẳn hoi mà app vẫn tưởng chưa xong (đã gặp thật). Nên ở đây
// dùng CẢ 2 CÁCH cùng lúc: (1) tín hiệu Module.onRuntimeInitialized kiểu cũ NẾU bản đang tải hỗ
// trợ, VÀ (2) tự kiểm tra trực tiếp mỗi 200ms xem `cv.Mat` đã dùng được chưa (không phụ thuộc
// bản nào báo hiệu kiểu gì) — cách nào báo trước thì tính là xong trước.
var CV_READY = false;
var CV_DEBUG = {
  source: null, readyVia: null, loadErrors: [], pollTimedOut: false,
  lastDetectAt: null, lastDetectFound: null, lastDetectError: null,
  detectTicks: 0, loopRestarts: 0, camRestarts: 0
};
function markCvReady(label) {
  if (CV_READY) return;
  CV_READY = true;
  CV_DEBUG.readyVia = label;
  console.log('OpenCV.js đã sẵn sàng (' + label + ') — bật tự động dò góc phiếu.');
  document.getElementById('autoToggleLabel').textContent = 'Tự động cắt';
}
var Module = {
  onRuntimeInitialized: function () { markCvReady('Module.onRuntimeInitialized'); }
};
function pollCvReady(triesLeft) {
  if (CV_READY) return;
  if (typeof cv !== 'undefined' && cv && typeof cv.Mat === 'function') { markCvReady('tự kiểm tra trực tiếp'); return; }
  if (triesLeft <= 0) { CV_DEBUG.pollTimedOut = true; return; } // hết giờ chờ — coi như tải lỗi/không hỗ trợ, giữ nguyên chế độ cắt tay
  setTimeout(function () { pollCvReady(triesLeft - 1); }, 200);
}
var OPENCV_SOURCES = [
  'https://docs.opencv.org/4.x/opencv.js',
  'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js'
];
function loadOpenCv(sourceIdx) {
  if (sourceIdx >= OPENCV_SOURCES.length) {
    document.getElementById('autoToggleLabel').textContent = 'Tự động cắt (lỗi tải cả 2 nguồn, dùng cắt tay)';
    var toggle = document.getElementById('autoDetectToggle');
    toggle.checked = false; toggle.disabled = true;
    return;
  }
  document.getElementById('autoToggleLabel').textContent = 'Tự động cắt (đang tải công cụ...)';
  CV_DEBUG.source = OPENCV_SOURCES[sourceIdx];
  var s = document.createElement('script');
  s.async = true;
  s.src = OPENCV_SOURCES[sourceIdx];
  s.onload = function () { pollCvReady(75); }; // chờ tối đa ~15s (75 x 200ms) cho WASM khởi động xong sau khi tải file về
  s.onerror = function () {
    console.warn('Không tải được OpenCV.js từ', OPENCV_SOURCES[sourceIdx], '— thử nguồn tiếp theo.');
    CV_DEBUG.loadErrors.push(OPENCV_SOURCES[sourceIdx]);
    loadOpenCv(sourceIdx + 1);
  };
  document.head.appendChild(s);
}
loadOpenCv(0);
</script>
<script>
// ============================================================
// TRẠNG THÁI CHÍNH — mỗi ca là 1 mảng ảnh, giữ trong bộ nhớ, KHÔNG gửi lên đâu cả
// (toàn bộ xử lý chạy ngay trong trình duyệt, không cần server/GAS).
//
// Mỗi ảnh lưu 2 bản: `dataUrl` = bản nét đầy đủ để xuất PDF, `thumb` = bản nhỏ ~260px CHỈ để hiện
// ô xem trước. LÝ DO (lỗi đã gặp): bản cũ dùng thẳng ảnh gốc cho lưới xem trước, mỗi lần chụp
// thêm 1 tấm là vẽ lại toàn bộ lưới bằng ảnh full vài MB — chụp vài tấm là máy cạn bộ nhớ, khiến
// các thao tác vẽ/đọc điểm ảnh sau đó chạy chậm hẳn hoặc lỗi.
// ============================================================
// jscanify chỉ cần tạo 1 lần, không phụ thuộc CV_READY (constructor của nó rỗng, chỉ đụng `cv`
// bên trong các hàm findPaperContour/getCornerPoints/extractPaper lúc gọi thật). Nếu CDN lỗi
// (rất hiếm, file nhỏ) thì tắt hẳn "Tự động cắt" ngay từ đầu — không âm thầm chạy dò cạnh kiểu cũ.
var scanner = (typeof jscanify !== 'undefined') ? new jscanify() : null;
if (!scanner) {
  console.warn('Không tải được jscanify — tắt tự động cắt, chỉ còn cắt tay.');
  document.getElementById('autoToggleLabel').textContent = 'Tự động cắt (thiếu thư viện, dùng cắt tay)';
  var _autoToggleNoLib = document.getElementById('autoDetectToggle');
  _autoToggleNoLib.checked = false; _autoToggleNoLib.disabled = true;
}

var CASE_PHOTOS = []; // [{ dataUrl, thumb, w, h, cropped }]
var sessionExportCount = 0;
var currentStream = null;
var currentTrack = null;
var imageCapture = null;   // đối tượng ImageCapture (nếu trình duyệt hỗ trợ) — chụp ảnh tĩnh full độ phân giải
var photoCaps = null;      // khả năng chụp ảnh tĩnh của camera (độ phân giải tối đa)
var usingFrontCamera = false;
var capturing = false;     // khoá nút chụp trong lúc đang lấy ảnh, tránh bấm chồng nhau

// --- Thông số chất lượng ảnh -----------------------------------------------------------------
// 2 con số này quyết định "ảnh xuất ra nét hay mờ" và "file PDF nặng hay nhẹ". Muốn file nhẹ hơn
// thì giảm MAX_EDGE xuống 2600 (~220 DPI, vẫn đọc được chữ); muốn nét tối đa thì giữ 3500.
var JPEG_QUALITY = 0.93;   // bản cũ để 0.90–0.92 và còn nén lại nhiều lần chồng lên nhau -> chữ mảnh bị nhoè
var MAX_EDGE = 3500;       // cạnh dài tối đa của ảnh lưu lại. A4 in 300 DPI = 2480×3508 -> 3500 là vừa đủ
var THUMB_EDGE = 260;      // cạnh dài của ảnh xem trước trong lưới
var VIDEO_FALLBACK_MAX = 2560; // máy không hỗ trợ chụp ảnh tĩnh riêng thì đẩy khung xem trước lên tối đa mức này

var video = document.getElementById('video');
var cameraMsg = document.getElementById('cameraMsg');
var countBadge = document.getElementById('countBadge');
var thumbGrid = document.getElementById('thumbGrid');
var emptyHint = document.getElementById('emptyHint');
var btnExportCase = document.getElementById('btnExportCase');
var btnShutter = document.getElementById('btnShutter');
var capStatus = document.getElementById('capStatus');
var LAST_CAP = { method: '(chưa chụp)', w: 0, h: 0, cropped: false, note: '' };

function showToast(msg, durationMs) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  t.addEventListener('click', function () { t.remove(); });
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, durationMs || 2200);
}

function setCapStatus(html) {
  capStatus.innerHTML = html;
  capStatus.style.display = 'block';
}

// Ước lượng độ nét khi in/đọc ở khổ A4 (cạnh dài 297mm = 11.7 inch) — chỉ để nhìn con số biết ảnh
// có đủ nét cho OCR không, không ảnh hưởng gì tới file xuất ra. Dưới ~150 DPI là chữ bắt đầu nhoè.
function estimateDpi(w, h) {
  return Math.round(Math.max(w, h) / 11.7);
}

// ------------------------------------------------------------
// CAMERA — dùng getUserMedia để có khung hình trực tiếp + chụp nhanh liên tục (đúng nhu cầu
// "chụp hàng loạt"). Nếu trình duyệt/máy không hỗ trợ hoặc từ chối quyền, còn có ô input file
// (capture=environment) ở dưới làm phương án dự phòng.
//
// VÌ SAO BẢN CŨ CHỤP RA KHÔNG NÉT: bấm chụp trước đây chỉ là "vẽ lại cái khung hình đang xem".
// Khung xem trước của trình duyệt thường chỉ 1280×720 hoặc 1920×1080, trong khi camera điện
// thoại chụp thật được 8–12 triệu điểm ảnh. Tờ A4 nằm trong khung 1080px chỉ chiếm ~900px chiều
// dài -> chưa tới 80 DPI, chữ trong phiếu nhoè hẳn. Cắt tự động còn làm nhỏ thêm nữa (chỉ giữ
// phần tờ giấy). CamScanner nét vì nó lấy ảnh CHỤP THẬT. Bản này làm đúng như vậy:
//   1. ImageCapture.takePhoto() -> ảnh chụp thật, độ phân giải lớn nhất máy cho phép.
//   2. Máy không có ImageCapture (iPhone/Safari) -> kéo khung xem trước lên mức cao nhất có thể.
//   3. Bật lấy nét liên tục (focusMode continuous) — mất nét cũng làm mờ y như thiếu điểm ảnh.
// ------------------------------------------------------------
function startCamera(preferFront) {
  stopCurrentStream();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    cameraMsg.textContent = 'Trình duyệt này không hỗ trợ mở camera trực tiếp — dùng ô "Chọn/chụp ảnh kiểu khác" bên dưới để chụp từng tấm.';
    return;
  }
  var constraints = {
    video: {
      facingMode: preferFront ? 'user' : { ideal: 'environment' },
      width: { ideal: 1920 }, height: { ideal: 1920 }
    },
    audio: false
  };
  navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
    currentStream = stream;
    currentTrack = stream.getVideoTracks()[0] || null;
    video.srcObject = stream;
    cameraMsg.textContent = '';
    setupStillCapture();
    // Bật vòng dò cạnh ở CẢ 2 sự kiện + 1 lần gọi thẳng: đã gặp cảnh gán onloadedmetadata sau khi
    // sự kiện đã bắn xong (lúc quay lại app từ nền), vòng dò cạnh không bao giờ khởi động lại.
    video.onloadedmetadata = function () { resizeOverlayToVideo(); startDetectLoop(); };
    video.onplaying = function () { resizeOverlayToVideo(); startDetectLoop(); };
    if (video.videoWidth) { resizeOverlayToVideo(); startDetectLoop(); }
    var p = video.play(); if (p && p.catch) p.catch(function () {});
  }).catch(function (err) {
    cameraMsg.textContent = 'Không mở được camera (' + (err && err.message ? err.message : err) + ') — dùng ô "Chọn/chụp ảnh kiểu khác" bên dưới để chụp từng tấm thay thế.';
  });
}

function stopCurrentStream() {
  if (currentStream) {
    currentStream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
  }
  currentStream = null; currentTrack = null; imageCapture = null; photoCaps = null;
}

function setupStillCapture() {
  if (!currentTrack) return;
  try {
    var caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : null;
    if (caps && caps.focusMode && caps.focusMode.indexOf && caps.focusMode.indexOf('continuous') >= 0) {
      currentTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
    }
    if (window.ImageCapture) {
      imageCapture = new window.ImageCapture(currentTrack);
      if (imageCapture.getPhotoCapabilities) {
        imageCapture.getPhotoCapabilities().then(function (pc) { photoCaps = pc; }).catch(function () { photoCaps = null; });
      }
    } else if (caps && caps.width && caps.width.max) {
      var wMax = Math.min(caps.width.max, VIDEO_FALLBACK_MAX);
      var hMax = (caps.height && caps.height.max) ? Math.min(caps.height.max, VIDEO_FALLBACK_MAX) : wMax;
      currentTrack.applyConstraints({ width: { ideal: wMax }, height: { ideal: hMax } })
        .then(function () { setTimeout(resizeOverlayToVideo, 300); })
        .catch(function () {});
    }
  } catch (e) {
    console.warn('Không chuẩn bị được chế độ chụp ảnh tĩnh:', e);
    imageCapture = null;
  }
}

document.getElementById('btnSwitchCam').addEventListener('click', function () {
  usingFrontCamera = !usingFrontCamera;
  startCamera(usingFrontCamera);
});

// CHỐT AN TOÀN (watchdog): cứ 2 giây kiểm tra camera + vòng dò cạnh còn sống không, chết thì bật
// lại. Bản cũ chỉ khởi động vòng dò cạnh đúng 1 lần lúc mở camera — chỉ cần 1 lần rời app (mở
// bảng chia sẻ để lưu PDF, khoá màn hình, chuyển tab, nhận cuộc gọi...) là hệ điều hành thu hồi
// luồng camera, khung hình đứng, từ đó không dò được khung giấy nữa nên mọi tấm chụp sau đều
// không được cắt — đúng hiện tượng "chỉ cắt được tấm đầu".
setInterval(function () {
  if (!currentStream) return;
  var t = currentStream.getVideoTracks()[0];
  if (!t || t.readyState === 'ended') {
    CV_DEBUG.camRestarts++;
    startCamera(usingFrontCamera);
    return;
  }
  if (!detectTimer) { CV_DEBUG.loopRestarts++; startDetectLoop(); }
  if (video.paused) { var p = video.play(); if (p && p.catch) p.catch(function () {}); }
}, 2000);

document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  var t = currentStream ? currentStream.getVideoTracks()[0] : null;
  if (!t || t.readyState === 'ended') { CV_DEBUG.camRestarts++; startCamera(usingFrontCamera); }
  else { var p = video.play(); if (p && p.catch) p.catch(function () {}); startDetectLoop(); }
});

// ------------------------------------------------------------
// TỰ ĐỘNG DÒ 4 GÓC TỜ PHIẾU (như viền xanh của CamScanner) — chạy bằng OpenCV.js + jscanify trên
// ảnh đã thu nhỏ (nhanh hơn nhiều lần so với xử lý ảnh gốc).
//
// QUAN TRỌNG — ĐIỂM SỬA để khung xuất ra khớp đúng khung anh thấy lúc đang ngắm: vòng lặp này vừa
// vẽ viền xanh xem trước, VỪA LƯU LẠI đúng khung đã dò được (lastDetectedQuad) cùng kích thước
// khung video tại thời điểm đó (lastDetectedVideoSize). Lúc bấm chụp, app DÙNG LẠI CHÍNH khung này
// (quy đổi tỉ lệ sang đúng kích thước ảnh chụp) thay vì dò lại từ đầu trên ảnh chụp.
//
// Lý do: ảnh chụp thật (qua ImageCapture.takePhoto()) và khung xem trước là 2 TẤM ẢNH KHÁC NHAU —
// khác độ phân giải, và trên nhiều điện thoại còn khác cả phơi sáng/màu sắc vì chế độ "chụp ảnh"
// xử lý khác chế độ "quay video". Dò lại từ đầu trên ảnh chụp có thể ra 1 khung KHÁC với khung anh
// đã thấy và ưng ý lúc đang ngắm — đúng hiện tượng "khung xem trước nhỏ gọn vừa khít giấy, nhưng
// ảnh xuất ra to hơn 30-40%". Dùng lại đúng khung đã thấy đảm bảo "thấy sao chụp vậy": không còn
// 2 lần dò trên 2 tấm ảnh khác nhau ra 2 kết quả khác nhau.
//
// Chỉ khi KHÔNG CÓ khung nào đã dò được lúc bấm chụp (vừa mở camera, giấy chưa kịp vào khung, vừa
// tắt rồi bật lại "Tự động cắt"...) app mới dò lại trên ảnh chụp làm phương án dự phòng — xem
// detectQuadOnFullImage bên dưới.
// ------------------------------------------------------------
var detectOverlay = document.getElementById('detectOverlay');
var detectCtx = detectOverlay.getContext('2d');
var detectTimer = null;
var lastDetectedQuad = null;      // 4 điểm {x,y} theo toạ độ pixel video gốc, thứ tự tl,tr,br,bl
var lastDetectedVideoSize = null; // { w, h } của khung video LÚC dò ra lastDetectedQuad — cần để quy đổi đúng tỉ lệ sang ảnh chụp (2 kích thước có thể khác nhau)
var DETECT_INTERVAL_MS = 350;
var DETECT_WORK_WIDTH = 420;      // dò cạnh trên ảnh thu nhỏ về bề rộng này cho nhanh
var DETECT_MIN_AREA_RATIO = 0.15; // khung dò được phải chiếm ít nhất 15% khung hình mới tính (tránh dò trúng vật nhỏ)
var workCanvas = document.createElement('canvas'); // DÙNG LẠI 1 canvas duy nhất cho mọi lần dò,
                                                   // không tạo canvas mới mỗi 350ms (gây rác bộ nhớ)

function resizeOverlayToVideo() {
  var rect = video.getBoundingClientRect();
  detectOverlay.width = Math.round(rect.width);
  detectOverlay.height = Math.round(rect.height);
}

function startDetectLoop() {
  if (detectTimer) clearInterval(detectTimer);
  detectTimer = setInterval(function () {
    if (!document.getElementById('autoDetectToggle').checked) {
      lastDetectedQuad = null; lastDetectedVideoSize = null;
      detectCtx.clearRect(0, 0, detectOverlay.width, detectOverlay.height);
      return;
    }
    if (!CV_READY || !currentStream || !video.videoWidth || capturing) return;
    CV_DEBUG.detectTicks++;
    CV_DEBUG.lastDetectAt = new Date().toLocaleTimeString('vi-VN');
    var scale = DETECT_WORK_WIDTH / video.videoWidth;
    workCanvas.width = DETECT_WORK_WIDTH;
    workCanvas.height = Math.max(1, Math.round(video.videoHeight * scale));
    workCanvas.getContext('2d').drawImage(video, 0, 0, workCanvas.width, workCanvas.height);
    var quad = detectQuadOnCanvas(workCanvas);
    if (quad) {
      lastDetectedQuad = quad.map(function (p) { return { x: p.x / scale, y: p.y / scale }; });
      lastDetectedVideoSize = { w: video.videoWidth, h: video.videoHeight };
    } else {
      lastDetectedQuad = null; lastDetectedVideoSize = null;
    }
    drawDetectOverlay();
  }, DETECT_INTERVAL_MS);
}

document.getElementById('autoDetectToggle').addEventListener('change', function () {
  if (!this.checked) { lastDetectedQuad = null; lastDetectedVideoSize = null; detectCtx.clearRect(0, 0, detectOverlay.width, detectOverlay.height); }
});

// Bấm để tự xem tình trạng thật — không cần mở console lập trình viên, chụp màn hình gửi đi là
// đủ để biết đang kẹt ở chỗ nào (ảnh mờ do đâu, vì sao không tự cắt).
document.getElementById('btnDebugInfo').addEventListener('click', function () {
  var t = currentStream ? currentStream.getVideoTracks()[0] : null;
  var lines = [
    '--- ẢNH VỪA CHỤP ---',
    'Lấy ảnh bằng cách: ' + LAST_CAP.method,
    'Độ phân giải: ' + (LAST_CAP.w ? LAST_CAP.w + '×' + LAST_CAP.h + ' (~' + estimateDpi(LAST_CAP.w, LAST_CAP.h) + ' DPI khổ A4)' : '(chưa chụp)'),
    'Có tự cắt được không: ' + (LAST_CAP.w ? (LAST_CAP.cropped ? 'CÓ (' + (LAST_CAP.source || '?') + ')' : 'KHÔNG — ' + (LAST_CAP.note || 'không rõ')) : '(chưa chụp)'),
    '--- CAMERA ---',
    'Máy hỗ trợ chụp ảnh tĩnh riêng (ImageCapture): ' + (!!window.ImageCapture) + (imageCapture ? ' — đang dùng' : ' — không dùng được'),
    'Ảnh tĩnh tối đa máy báo: ' + (photoCaps && photoCaps.imageWidth ? photoCaps.imageWidth.max + '×' + (photoCaps.imageHeight ? photoCaps.imageHeight.max : '?') : '(không rõ)'),
    'Khung hình xem trước: ' + (video.videoWidth || 0) + '×' + (video.videoHeight || 0),
    'Camera đang chạy: ' + (!!currentStream) + (t ? ' (' + t.readyState + ')' : ''),
    'Số lần tự mở lại camera: ' + CV_DEBUG.camRestarts,
    '--- DÒ CẠNH ---',
    'Thư viện jscanify: ' + (scanner ? 'đã tải (v1.4.0, MIT)' : 'LỖI — không tải được, chỉ còn cắt tay'),
    'Nguồn OpenCV: ' + (CV_DEBUG.source || '(chưa bắt đầu tải)'),
    'CV_READY: ' + CV_READY + ' (' + (CV_DEBUG.readyVia || 'chưa có') + ')',
    'Đang có khung đã dò từ lúc xem trước (dùng lại lúc chụp): ' + (!!lastDetectedQuad),
    'Vòng dò cạnh đang chạy: ' + (!!detectTimer) + ' — đã chạy ' + CV_DEBUG.detectTicks + ' lượt, tự bật lại ' + CV_DEBUG.loopRestarts + ' lần',
    'Lần dò gần nhất: ' + (CV_DEBUG.lastDetectAt || '(chưa chạy lần nào)') + ' — thấy khung giấy: ' + CV_DEBUG.lastDetectFound,
    'Lỗi lần dò gần nhất: ' + (CV_DEBUG.lastDetectError || '(không có)'),
    'Nguồn OpenCV bị lỗi tải: ' + (CV_DEBUG.loadErrors.length ? CV_DEBUG.loadErrors.join(', ') : '(không có)')
  ];
  alert(lines.join('\n'));

// Dò 4 góc tờ giấy trên 1 canvas bất kỳ, bằng chính thư viện jscanify (không tự viết lại thuật
// toán). Trả về mảng 4 điểm theo toạ độ CHÍNH CANVAS ĐÓ, thứ tự tl,tr,br,bl — hoặc null nếu không
// tìm được. Dùng chung cho cả vòng xem trước lẫn (khi cần) dò dự phòng trên ảnh chụp.
function detectQuadOnCanvas(cnv) {
  if (!CV_READY) { CV_DEBUG.lastDetectError = 'OpenCV chưa sẵn sàng'; return null; }
  if (!scanner) { CV_DEBUG.lastDetectError = 'jscanify chưa tải được'; return null; }
  var img;
  var pts = null;
  try {
    img = cv.imread(cnv);
    var contour = scanner.findPaperContour(img); // trả về contour LỚN NHẤT tìm được, có thể null
    if (contour) {
      var minArea = cnv.width * cnv.height * DETECT_MIN_AREA_RATIO;
      var area = cv.contourArea(contour);
      if (area >= minArea) {
        var c = scanner.getCornerPoints(contour);
        if (c.topLeftCorner && c.topRightCorner && c.bottomLeftCorner && c.bottomRightCorner) {
          pts = [c.topLeftCorner, c.topRightCorner, c.bottomRightCorner, c.bottomLeftCorner]; // tl,tr,br,bl
        }
      }
      contour.delete();
    }
    CV_DEBUG.lastDetectFound = !!pts;
    CV_DEBUG.lastDetectError = null;
  } catch (e) {
    console.warn('Lỗi dò cạnh (bỏ qua lần này):', e);
    CV_DEBUG.lastDetectError = (e && e.message) ? e.message : String(e);
    CV_DEBUG.lastDetectFound = false;
    pts = null;
  } finally {
    if (img) img.delete();
  }
  return pts;
}

// Dò 4 góc trên 1 canvas ảnh lớn — CHỈ dùng làm PHƯƠNG ÁN DỰ PHÒNG khi lúc bấm chụp không có sẵn
// khung nào đã dò được từ vòng xem trước (xem giải thích ở đầu phần trên). Thu nhỏ về
// DETECT_WORK_WIDTH để dò cho nhanh rồi quy đổi toạ độ ngược lại về đúng độ phân giải ảnh gốc.
function detectQuadOnFullImage(bigCanvas) {
  var s = DETECT_WORK_WIDTH / bigCanvas.width;
  if (s >= 1) return detectQuadOnCanvas(bigCanvas);
  var probe = document.createElement('canvas');
  probe.width = DETECT_WORK_WIDTH;
  probe.height = Math.max(1, Math.round(bigCanvas.height * s));
  probe.getContext('2d').drawImage(bigCanvas, 0, 0, probe.width, probe.height);
  var q = detectQuadOnCanvas(probe);
  return q ? q.map(function (p) { return { x: p.x / s, y: p.y / s }; }) : null;
}

function drawDetectOverlay() {
  var rect = video.getBoundingClientRect();
  if (detectOverlay.width !== Math.round(rect.width) || detectOverlay.height !== Math.round(rect.height)) resizeOverlayToVideo();
  detectCtx.clearRect(0, 0, detectOverlay.width, detectOverlay.height);
  if (!lastDetectedQuad) return;
  // video dùng object-fit:cover -> quy đổi toạ độ pixel video thật sang toạ độ hiển thị trên màn
  var vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  var elW = detectOverlay.width, elH = detectOverlay.height;
  var videoRatio = vw / vh, elRatio = elW / elH;
  var drawW, drawH, offX, offY;
  if (videoRatio > elRatio) { drawH = elH; drawW = elH * videoRatio; offX = (elW - drawW) / 2; offY = 0; }
  else { drawW = elW; drawH = elW / videoRatio; offX = 0; offY = (elH - drawH) / 2; }
  var toDisp = function (p) { return { x: offX + p.x / vw * drawW, y: offY + p.y / vh * drawH }; };
  var pts = lastDetectedQuad.map(toDisp);

  detectCtx.strokeStyle = '#2fd15a';
  detectCtx.lineWidth = 3;
  detectCtx.beginPath();
  detectCtx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < 4; i++) detectCtx.lineTo(pts[i].x, pts[i].y);
  detectCtx.closePath();
  detectCtx.stroke();
  pts.forEach(function (p) {
    detectCtx.fillStyle = '#2fd15a';
    detectCtx.beginPath(); detectCtx.arc(p.x, p.y, 5, 0, 2 * Math.PI); detectCtx.fill();
  });
}

// ------------------------------------------------------------
// LẤY 1 TẤM ẢNH TĨNH — ưu tiên ảnh chụp thật, lùi dần về cách kém hơn nếu máy không cho.
// Thứ tự: takePhoto (nét nhất) -> vẽ lại khung hình xem trước (nét kém nhất, luôn chạy được).
// Luôn có hàng rào thời gian: takePhoto trên vài dòng máy có thể treo không trả lời — quá 5 giây
// thì tự chuyển sang cách dự phòng chứ không để bấm mãi không thấy gì.
// ------------------------------------------------------------
function captureStillCanvas() {
  return new Promise(function (resolve, reject) {
    var settled = false;
    var wantHiRes = document.getElementById('hiresToggle').checked;

    function fallbackToVideo(reason) {
      if (settled) return; settled = true;
      var vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) { reject(new Error('Camera chưa sẵn sàng, đợi 1 chút rồi chụp lại')); return; }
      var c = document.createElement('canvas');
      c.width = vw; c.height = vh;
      var ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(video, 0, 0, vw, vh);
      resolve({ canvas: c, method: 'khung hình xem trước' + (reason ? ' (' + reason + ')' : '') });
    }

    if (!wantHiRes || !imageCapture || typeof imageCapture.takePhoto !== 'function') {
      fallbackToVideo(wantHiRes ? 'máy không hỗ trợ chụp ảnh tĩnh riêng' : 'đang tắt "Chụp nét cao"');
      return;
    }

    var guard = setTimeout(function () { fallbackToVideo('ảnh chụp thật quá lâu'); }, 5000);

    var opts = {};
    if (photoCaps && photoCaps.imageWidth && photoCaps.imageWidth.max) opts.imageWidth = photoCaps.imageWidth.max;
    if (photoCaps && photoCaps.imageHeight && photoCaps.imageHeight.max) opts.imageHeight = photoCaps.imageHeight.max;

    imageCapture.takePhoto(opts)
      .catch(function () { return imageCapture.takePhoto(); }) // vài máy từ chối khi ép sẵn kích thước -> chụp mặc định
      .then(blobToCanvas)
      .then(function (c) {
        clearTimeout(guard);
        if (settled) return;
        if (!c.width || !c.height) { fallbackToVideo('ảnh chụp thật rỗng'); return; }
        settled = true;
        resolve({ canvas: c, method: 'ảnh chụp thật của camera' });
      })
      .catch(function (err) {
        clearTimeout(guard);
        console.warn('takePhoto lỗi:', err);
        fallbackToVideo('lỗi chụp ảnh thật');
      });
  });
}

function blobToCanvas(blob) {
  var toCanvas = function (src, w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, 0, 0);
    return c;
  };
  if (window.createImageBitmap) {
    var p;
    // imageOrientation:'from-image' để ảnh chụp dọc không bị nằm ngang (thẻ EXIF xoay ảnh)
    try { p = createImageBitmap(blob, { imageOrientation: 'from-image' }); }
    catch (e) { p = createImageBitmap(blob); }
    return p.catch(function () { return createImageBitmap(blob); }).then(function (bmp) {
      var c = toCanvas(bmp, bmp.width, bmp.height);
      if (bmp.close) { try { bmp.close(); } catch (e2) {} }
      return c;
    });
  }
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () { var c = toCanvas(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); resolve(c); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('không đọc được ảnh chụp')); };
    img.src = url;
  });
}

// ------------------------------------------------------------
// BẤM CHỤP
// ------------------------------------------------------------
btnShutter.addEventListener('click', function () {
  if (capturing) return;
  if (!currentStream) { showToast('Camera chưa sẵn sàng.'); return; }
  capturing = true;
  btnShutter.disabled = true;
  flashShutter();

  // Chụp lại ĐÚNG khung đã dò được lúc đang xem trước — chính là cái anh đang nhìn thấy dán mắt
  // vào màn hình ngay lúc bấm nút. Snapshot NGAY BÂY GIỜ (trước khi lấy ảnh chụp thật, việc này có
  // thể mất một chút thời gian) để chắc chắn đúng là khung tại thời điểm bấm, không phải khung của
  // một khoảnh khắc muộn hơn.
  var liveQuad = lastDetectedQuad;
  var liveVideoSize = lastDetectedVideoSize;

  captureStillCanvas().then(function (res) {
    var srcCanvas = res.canvas;
    var autoOn = document.getElementById('autoDetectToggle').checked;
    var quad = null, note = '', source = '';

    if (!autoOn) {
      note = 'đang tắt tự động cắt';
    } else if (liveQuad && liveVideoSize) {
      // DÙNG LẠI khung đã thấy lúc xem trước, quy đổi THEO TỈ LỆ (không phải cộng/trừ toạ độ tuyệt
      // đối) sang đúng kích thước ảnh chụp thật — vì ảnh chụp thật thường khác kích thước khung xem
      // trước. Đây là điểm sửa để "thấy sao chụp vậy": không dò lại từ đầu trên 1 tấm ảnh khác (có
      // thể ra kết quả khác) mà dùng đúng khung anh đã thấy và ưng ý.
      var sx = srcCanvas.width / liveVideoSize.w, sy = srcCanvas.height / liveVideoSize.h;
      quad = liveQuad.map(function (p) { return { x: p.x * sx, y: p.y * sy }; });
      source = 'khung đã thấy lúc xem trước';
    } else if (CV_READY) {
      // Không có khung nào sẵn (vừa mở camera, giấy chưa kịp vào khung, vừa bật lại "Tự động
      // cắt"...) — dò dự phòng ngay trên ảnh chụp thật, còn hơn không cắt được tấm nào.
      quad = detectQuadOnFullImage(srcCanvas);
      source = 'dò dự phòng trên ảnh chụp';
      if (!quad) note = 'không thấy đủ 4 cạnh tờ phiếu (dò dự phòng)';
    } else {
      note = 'công cụ dò cạnh chưa tải xong';
    }

    var outCanvas = quad ? warpToCanvasCv(srcCanvas, quad) : downscaleToCanvas(srcCanvas);
    var dataUrl = outCanvas.toDataURL('image/jpeg', JPEG_QUALITY); // CHỈ nén JPEG đúng 1 lần
    var thumb = makeThumb(outCanvas);

    LAST_CAP = { method: res.method, w: outCanvas.width, h: outCanvas.height, cropped: !!quad, note: note, source: source };
    setCapStatus('<b>' + outCanvas.width + '×' + outCanvas.height + '</b> (~' + estimateDpi(outCanvas.width, outCanvas.height) + ' DPI khổ A4) · ' + res.method +
      (quad ? ' · đã tự cắt (' + source + ')' : ' · <span class="bad">chưa cắt: ' + note + '</span>'));
    if (autoOn && !quad) showToast('Tấm này chưa tự cắt được (' + note + ') — cắt tay bằng nút ✎ nếu cần.', 2600);

    addPhotoToCase({ dataUrl: dataUrl, thumb: thumb, w: outCanvas.width, h: outCanvas.height, cropped: !!quad });
    flyToBadge(thumb);
  }).catch(function (err) {
    showToast('Chụp lỗi: ' + (err && err.message ? err.message : err), 3200);
  }).then(function () {
    capturing = false;
    btnShutter.disabled = false;
  });
});

// Từ toạ độ 4 góc, tính kích thước trang xuất ra (thu về cạnh dài tối đa MAX_EDGE) — dùng chung
// cho cả 2 cách cắt bên dưới.
function outSizeForQuad(quad) {
  var outW = Math.round(Math.hypot(quad[1].x - quad[0].x, quad[1].y - quad[0].y));
  var outH = Math.round(Math.hypot(quad[3].x - quad[0].x, quad[3].y - quad[0].y));
  outW = Math.max(outW, 40); outH = Math.max(outH, 40);
  var k = Math.min(1, MAX_EDGE / Math.max(outW, outH));
  return { w: Math.round(outW * k), h: Math.round(outH * k) };
}

// CẮT BẰNG jscanify (cv.warpPerspective thật qua scanner.extractPaper) — dùng cho toạ độ do TỰ
// ĐỘNG dò ra (dù là dùng lại khung đã thấy lúc xem trước, hay dò dự phòng trên ảnh chụp). Phép
// chiếu (homography) đúng chuẩn, không có vệt gãy dọc đường chéo như cách cắt tay bằng 2 tam giác
// bên dưới (warpToCanvasManual) — rõ nhất ở những tấm chụp hơi xiên góc. Truyền sẵn cornerPoints
// cho extractPaper() để nó bỏ qua bước dò lại từ đầu (đỡ tốn máy).
function warpToCanvasCv(srcCanvas, quad) {
  var sz = outSizeForQuad(quad);
  var corners = {
    topLeftCorner: quad[0], topRightCorner: quad[1],
    bottomRightCorner: quad[2], bottomLeftCorner: quad[3]
  };
  var out = null;
  try { out = scanner.extractPaper(srcCanvas, sz.w, sz.h, corners); } catch (e) { console.warn('extractPaper lỗi:', e); }
  return out || downscaleToCanvas(srcCanvas); // cực hiếm khi lỗi — vẫn giữ được tấm ảnh, chỉ là chưa cắt
}

// CẮT TAY bằng 2 tam giác vẽ trên canvas 2D (KHÔNG phụ thuộc OpenCV/jscanify) — dùng cho khung 4
// góc anh tự kéo trong modal sửa ảnh, để việc cắt tay luôn chạy được kể cả khi OpenCV/jscanify tải
// lỗi hoàn toàn (đây chính là lý do "chắc ăn" của cắt tay, không được đổi sang phụ thuộc OpenCV).
function warpToCanvasManual(srcCanvas, quad) {
  var sz = outSizeForQuad(quad);
  var c = document.createElement('canvas');
  c.width = sz.w; c.height = sz.h;
  var ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  drawPerspectiveQuad(ctx, srcCanvas, quad, sz.w, sz.h);
  return c;
}

function downscaleToCanvas(srcCanvas) {
  var k = Math.min(1, MAX_EDGE / Math.max(srcCanvas.width, srcCanvas.height));
  if (k === 1) return srcCanvas;
  var c = document.createElement('canvas');
  c.width = Math.round(srcCanvas.width * k);
  c.height = Math.round(srcCanvas.height * k);
  var ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(srcCanvas, 0, 0, c.width, c.height);
  return c;
}

// Ảnh nhỏ chỉ dùng cho lưới xem trước + hiệu ứng bay — giữ ảnh gốc nét nguyên vẹn cho file PDF,
// đồng thời không bắt trình duyệt vẽ vài tấm ảnh 12MP cùng lúc mỗi lần chụp thêm.
function makeThumb(srcCanvas) {
  var k = Math.min(1, THUMB_EDGE / Math.max(srcCanvas.width, srcCanvas.height));
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(srcCanvas.width * k));
  c.height = Math.max(1, Math.round(srcCanvas.height * k));
  var ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(srcCanvas, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.75);
}

// Chớp nhanh cả khung camera (như tiếng "tách" của máy ảnh) — phản hồi tức thì ngay lúc bấm.
function flashShutter() {
  var flash = document.createElement('div');
  flash.style.cssText = 'position:absolute;inset:0;background:#fff;opacity:.85;pointer-events:none;z-index:12;transition:opacity .18s ease-out;';
  document.getElementById('cameraWrap').appendChild(flash);
  requestAnimationFrame(function () { flash.style.opacity = '0'; });
  setTimeout(function () { flash.remove(); }, 220);
}

// Hiệu ứng "bay" tấm ảnh vừa chụp thu nhỏ dần về đúng ô đếm số ảnh (góc trên camera) — bấm nhanh
// quá không biết đã chụp được chưa, vì danh sách ảnh nằm phía dưới phải cuộn mới thấy.
function flyToBadge(thumbUrl) {
  var camRect = document.getElementById('cameraWrap').getBoundingClientRect();
  var badgeRect = countBadge.getBoundingClientRect();
  var startW = camRect.width * 0.34, startH = startW * (4 / 3);
  var img = document.createElement('img');
  img.src = thumbUrl;
  img.style.cssText = 'position:fixed;z-index:60;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.5);pointer-events:none;' +
    'left:' + (camRect.left + camRect.width / 2 - startW / 2) + 'px;' +
    'top:' + (camRect.top + camRect.height / 2 - startH / 2) + 'px;' +
    'width:' + startW + 'px;height:' + startH + 'px;' +
    'transition:left .45s cubic-bezier(.3,.6,.4,1),top .45s cubic-bezier(.3,.6,.4,1),width .45s cubic-bezier(.3,.6,.4,1),height .45s cubic-bezier(.3,.6,.4,1),opacity .45s ease-in;';
  document.body.appendChild(img);
  requestAnimationFrame(function () {
    img.style.left = (badgeRect.left + badgeRect.width / 2 - 8) + 'px';
    img.style.top = (badgeRect.top + badgeRect.height / 2 - 8) + 'px';
    img.style.width = '16px'; img.style.height = '16px';
    img.style.opacity = '0.15';
  });
  setTimeout(function () {
    img.remove();
    pulseBadge();
  }, 460);
}

function pulseBadge() {
  countBadge.style.transition = 'transform .18s ease-out';
  countBadge.style.transform = 'scale(1.35)';
  setTimeout(function () { countBadge.style.transform = 'scale(1)'; }, 180);
}

// Ảnh chọn từ thư viện / camera hệ thống: ảnh này vốn đã nét (full độ phân giải của máy), chỉ cần
// thu về MAX_EDGE, và cũng thử tự cắt luôn cho đồng nhất với ảnh chụp trong app.
document.getElementById('fileFallback').addEventListener('change', function (e) {
  var files = Array.from(e.target.files || []);
  files.forEach(function (file) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var base = document.createElement('canvas');
        base.width = img.naturalWidth || img.width;
        base.height = img.naturalHeight || img.height;
        var bctx = base.getContext('2d');
        bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = 'high';
        bctx.drawImage(img, 0, 0);

        var quad = (document.getElementById('autoDetectToggle').checked && CV_READY) ? detectQuadOnFullImage(base) : null;
        var out = quad ? warpToCanvasCv(base, quad) : downscaleToCanvas(base);
        addPhotoToCase({
          dataUrl: out.toDataURL('image/jpeg', JPEG_QUALITY),
          thumb: makeThumb(out),
          w: out.width, h: out.height, cropped: !!quad
        });
        pulseBadge();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value = ''; // cho phép chọn lại đúng file đó lần sau nếu cần
});

// ------------------------------------------------------------
// QUẢN LÝ ẢNH TRONG 1 CA
// ------------------------------------------------------------
function addPhotoToCase(photo) {
  CASE_PHOTOS.push(photo);
  renderThumbs();
}

function renderThumbs() {
  countBadge.style.display = CASE_PHOTOS.length ? 'block' : 'none';
  countBadge.textContent = CASE_PHOTOS.length + ' ảnh';
  emptyHint.style.display = CASE_PHOTOS.length ? 'none' : 'block';
  btnExportCase.disabled = CASE_PHOTOS.length === 0;
  btnExportCase.textContent = CASE_PHOTOS.length ? ('Xong ca này — Xuất PDF (' + CASE_PHOTOS.length + ' trang)') : 'Xong ca này — Xuất PDF';

  thumbGrid.innerHTML = '';
  CASE_PHOTOS.forEach(function (p, i) {
    var div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML =
      '<img src="' + p.thumb + '">' +
      '<div class="idx">' + (i + 1) + '</div>' +
      '<div class="px">' + (p.cropped ? '✂ ' : '') + estimateDpi(p.w, p.h) + ' DPI</div>' +
      '<div class="actions">' +
      (i > 0 ? '<button data-act="left" data-i="' + i + '">◀</button>' : '') +
      '<button data-act="edit" data-i="' + i + '">✎</button>' +
      '<button data-act="del" data-i="' + i + '">🗑</button>' +
      (i < CASE_PHOTOS.length - 1 ? '<button data-act="right" data-i="' + i + '">▶</button>' : '') +
      '</div>';
    thumbGrid.appendChild(div);
  });
}

thumbGrid.addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var i = parseInt(btn.dataset.i, 10);
  var act = btn.dataset.act;
  if (act === 'del') {
    CASE_PHOTOS.splice(i, 1);
    renderThumbs();
  } else if (act === 'left' && i > 0) {
    var tmp = CASE_PHOTOS[i - 1]; CASE_PHOTOS[i - 1] = CASE_PHOTOS[i]; CASE_PHOTOS[i] = tmp;
    renderThumbs();
  } else if (act === 'right' && i < CASE_PHOTOS.length - 1) {
    var tmp2 = CASE_PHOTOS[i + 1]; CASE_PHOTOS[i + 1] = CASE_PHOTOS[i]; CASE_PHOTOS[i] = tmp2;
    renderThumbs();
  } else if (act === 'edit') {
    openEditModal(i);
  }
});

document.getElementById('btnClearCase').addEventListener('click', function () {
  if (!CASE_PHOTOS.length) return;
  if (confirm('Xoá hết ' + CASE_PHOTOS.length + ' ảnh đang chụp cho ca này?')) {
    CASE_PHOTOS = [];
    renderThumbs();
  }
});

// ------------------------------------------------------------
// MODAL SỬA ẢNH — xoay 90° từng nấc + cắt gọt bằng cách kéo 4 góc. Phương án "chắc ăn" khi tự
// động dò cạnh không ra khung (phiếu nhăn, nền cùng màu giấy, thiếu sáng...).
// ------------------------------------------------------------
var editIndex = -1;
var editImg = null; // Image gốc đang sửa
var editRotation = 0; // 0/90/180/270, áp dụng TRƯỚC khi tính khung cắt
var cropPts = null; // 4 điểm góc, toạ độ trên canvas hiển thị: [{x,y} tl, tr, br, bl]
var draggingHandle = -1;
var editModal = document.getElementById('editModal');
var editCanvas = document.getElementById('editCanvas');
var editCtx = editCanvas.getContext('2d');
var handleEls = [];

function openEditModal(i) {
  editIndex = i;
  editRotation = 0;
  editImg = new Image();
  editImg.onload = function () {
    layoutEditCanvas();
    resetCropToFull();
    drawEditCanvas();
  };
  editImg.src = CASE_PHOTOS[i].dataUrl;
  editModal.classList.add('show');
}

function rotatedSize() {
  var w = editImg.width, h = editImg.height;
  return (editRotation % 180 === 0) ? { w: w, h: h } : { w: h, h: w };
}

function layoutEditCanvas() {
  var stage = document.getElementById('editStage');
  var maxW = stage.clientWidth - 20, maxH = stage.clientHeight - 20;
  var sz = rotatedSize();
  var scale = Math.min(maxW / sz.w, maxH / sz.h, 1);
  editCanvas.width = Math.round(sz.w * scale);
  editCanvas.height = Math.round(sz.h * scale);
  editCanvas.dataset.scale = scale;
}

function resetCropToFull() {
  var w = editCanvas.width, h = editCanvas.height;
  var m = Math.round(Math.min(w, h) * 0.04); // lề nhỏ để nhìn rõ 4 góc khi mới mở
  cropPts = [{ x: m, y: m }, { x: w - m, y: m }, { x: w - m, y: h - m }, { x: m, y: h - m }];
}

function drawEditCanvas() {
  var w = editCanvas.width, h = editCanvas.height;
  editCtx.save();
  editCtx.clearRect(0, 0, w, h);
  editCtx.imageSmoothingEnabled = true; editCtx.imageSmoothingQuality = 'high';
  editCtx.translate(w / 2, h / 2);
  editCtx.rotate(editRotation * Math.PI / 180);
  if (editRotation % 180 === 0) editCtx.drawImage(editImg, -w / 2, -h / 2, w, h);
  else editCtx.drawImage(editImg, -h / 2, -w / 2, h, w);
  editCtx.restore();

  // vùng ngoài khung cắt làm tối lại cho dễ nhìn
  editCtx.save();
  editCtx.fillStyle = 'rgba(0,0,0,.45)';
  editCtx.beginPath();
  editCtx.rect(0, 0, w, h);
  editCtx.moveTo(cropPts[0].x, cropPts[0].y);
  for (var i = 1; i < 4; i++) editCtx.lineTo(cropPts[i].x, cropPts[i].y);
  editCtx.closePath();
  editCtx.fill('evenodd');
  editCtx.restore();

  editCtx.strokeStyle = '#1a56db'; editCtx.lineWidth = 2;
  editCtx.beginPath();
  editCtx.moveTo(cropPts[0].x, cropPts[0].y);
  for (var j = 1; j < 4; j++) editCtx.lineTo(cropPts[j].x, cropPts[j].y);
  editCtx.closePath(); editCtx.stroke();

  positionHandles();
}

function positionHandles() {
  var stage = document.getElementById('editStage');
  if (!handleEls.length) {
    for (var k = 0; k < 4; k++) {
      var h = document.createElement('div');
      h.className = 'crop-handle';
      h.dataset.idx = k;
      stage.appendChild(h);
      handleEls.push(h);
    }
  }
  var stageRect = stage.getBoundingClientRect();
  var canvasRect = editCanvas.getBoundingClientRect();
  var offX = canvasRect.left - stageRect.left, offY = canvasRect.top - stageRect.top;
  handleEls.forEach(function (h, idx) {
    h.style.left = (offX + cropPts[idx].x) + 'px';
    h.style.top = (offY + cropPts[idx].y) + 'px';
  });
}

function handlePointerDown(idx, e) {
  draggingHandle = idx;
  e.preventDefault();
}
handleEls = []; // sẽ được tạo trong positionHandles() lần đầu drawEditCanvas()

document.getElementById('editStage').addEventListener('pointerdown', function (e) {
  var t = e.target.closest('.crop-handle');
  if (t) handlePointerDown(parseInt(t.dataset.idx, 10), e);
});
window.addEventListener('pointermove', function (e) {
  if (draggingHandle < 0 || !editModal.classList.contains('show')) return;
  var canvasRect = editCanvas.getBoundingClientRect();
  var x = Math.max(0, Math.min(editCanvas.width, e.clientX - canvasRect.left));
  var y = Math.max(0, Math.min(editCanvas.height, e.clientY - canvasRect.top));
  cropPts[draggingHandle] = { x: x, y: y };
  drawEditCanvas();
});
window.addEventListener('pointerup', function () { draggingHandle = -1; });

document.getElementById('btnEditRotateL').addEventListener('click', function () {
  editRotation = (editRotation + 270) % 360;
  layoutEditCanvas();
  resetCropToFull();
  drawEditCanvas();
});
document.getElementById('btnEditReset').addEventListener('click', function () {
  resetCropToFull();
  drawEditCanvas();
});
document.getElementById('btnEditCancel').addEventListener('click', function () {
  editModal.classList.remove('show');
});

document.getElementById('btnEditDone').addEventListener('click', function () {
  // Cắt bằng phối cảnh đơn giản: dùng khung tứ giác 4 góc đã kéo, "duỗi thẳng" về hình chữ nhật
  // bằng phép biến đổi affine ghép từ 2 tam giác (đủ tốt cho ảnh chụp phiếu giấy).
  //
  // QUAN TRỌNG: cropPts đang tính theo toạ độ của editCanvas — vốn đã bị THU NHỎ để vừa màn hình
  // lúc sửa (xem layoutEditCanvas()), KHÔNG phải kích thước ảnh gốc. Nếu cắt thẳng trên đó thì
  // ảnh ra bị vỡ hạt (đã gặp thật). Phải quy đổi cropPts NGƯỢC LẠI về đúng độ phân giải ảnh gốc
  // trước khi cắt, để ảnh ra vẫn nét như ảnh chụp ban đầu.
  var editScale = parseFloat(editCanvas.dataset.scale) || 1;
  var rotSz = rotatedSize(); // kích thước ảnh gốc SAU khi xoay, CHƯA thu nhỏ

  var srcCanvas = document.createElement('canvas');
  srcCanvas.width = rotSz.w; srcCanvas.height = rotSz.h;
  var sctx = srcCanvas.getContext('2d');
  sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
  sctx.save();
  sctx.translate(srcCanvas.width / 2, srcCanvas.height / 2);
  sctx.rotate(editRotation * Math.PI / 180);
  sctx.drawImage(editImg, -editImg.width / 2, -editImg.height / 2);
  sctx.restore();

  var cropPtsFullRes = cropPts.map(function (p) { return { x: p.x / editScale, y: p.y / editScale }; });
  var outCanvas = warpToCanvasManual(srcCanvas, cropPtsFullRes);

  CASE_PHOTOS[editIndex].dataUrl = outCanvas.toDataURL('image/jpeg', JPEG_QUALITY);
  CASE_PHOTOS[editIndex].thumb = makeThumb(outCanvas);
  CASE_PHOTOS[editIndex].w = outCanvas.width;
  CASE_PHOTOS[editIndex].h = outCanvas.height;
  CASE_PHOTOS[editIndex].cropped = true;
  editModal.classList.remove('show');
  renderThumbs();
});

// Vẽ 1 tứ giác nguồn (4 góc bất kỳ) thành hình chữ nhật đích, bằng cách chia đôi thành 2 tam
// giác và dùng phép biến đổi affine (setTransform) cho từng tam giác — đủ dùng cho việc "duỗi
// thẳng" ảnh chụp hơi lệch góc, không cần thư viện ngoài.
function drawPerspectiveQuad(ctx, srcCanvas, pts, outW, outH) {
  ctx.clearRect(0, 0, outW, outH);
  drawTriangle(ctx, srcCanvas, pts[0], pts[1], pts[2], { x: 0, y: 0 }, { x: outW, y: 0 }, { x: outW, y: outH });
  drawTriangle(ctx, srcCanvas, pts[0], pts[2], pts[3], { x: 0, y: 0 }, { x: outW, y: outH }, { x: 0, y: outH });
}
function drawTriangle(ctx, img, s0, s1, s2, d0, d1, d2) {
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(d0.x, d0.y); ctx.lineTo(d1.x, d1.y); ctx.lineTo(d2.x, d2.y);
  ctx.closePath(); ctx.clip();
  var denom = s0.x * (s1.y - s2.y) + s1.x * (s2.y - s0.y) + s2.x * (s0.y - s1.y);
  if (Math.abs(denom) < 1e-6) { ctx.restore(); return; }
  var a = (d0.x * (s1.y - s2.y) + d1.x * (s2.y - s0.y) + d2.x * (s0.y - s1.y)) / denom;
  var b = (d0.y * (s1.y - s2.y) + d1.y * (s2.y - s0.y) + d2.y * (s0.y - s1.y)) / denom;
  var c = (d0.x * (s2.x - s1.x) + d1.x * (s0.x - s2.x) + d2.x * (s1.x - s0.x)) / denom;
  var d = (d0.y * (s2.x - s1.x) + d1.y * (s0.x - s2.x) + d2.y * (s1.x - s0.x)) / denom;
  var e = (d0.x * (s1.x * s2.y - s2.x * s1.y) + d1.x * (s2.x * s0.y - s0.x * s2.y) + d2.x * (s0.x * s1.y - s1.x * s0.y)) / denom;
  var f = (d0.y * (s1.x * s2.y - s2.x * s1.y) + d1.y * (s2.x * s0.y - s0.x * s2.y) + d2.y * (s0.x * s1.y - s1.x * s0.y)) / denom;
  ctx.transform(a, b, c, d, e, f);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

// ------------------------------------------------------------
// XUẤT PDF — gộp toàn bộ ảnh của ca hiện tại thành 1 file PDF nhiều trang, mỗi ảnh 1 trang khổ
// A4, canh giữa và co giãn vừa trang (giữ nguyên tỉ lệ, không méo ảnh).
//
// jsPDF nhúng THẲNG ảnh JPEG vào PDF (không nén lại) khi truyền dataURL JPEG + format 'JPEG' —
// nên độ nét của file PDF đúng bằng độ nét của ảnh chụp, không mất thêm lần nào nữa.
// ------------------------------------------------------------
btnExportCase.addEventListener('click', function () {
  if (!CASE_PHOTOS.length) return;
  var jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if (!jsPDFCtor) { showToast('Chưa tải được thư viện xuất PDF, kiểm tra lại mạng rồi thử lại.'); return; }
  var pdf = new jsPDFCtor({ unit: 'pt', format: 'a4', compress: false });
  var pageW = pdf.internal.pageSize.getWidth();
  var pageH = pdf.internal.pageSize.getHeight();
  var margin = 18;

  // Kích thước từng ảnh đã được lưu sẵn lúc chụp (p.w, p.h) nên KHÔNG cần tải/giải mã lại ảnh
  // trước khi ghép PDF. Bản cũ tạo `new Image()` cho từng tấm rồi chờ onload — chỉ cần 1 tấm
  // không giải mã được (máy thiếu bộ nhớ khi ảnh lớn) là nút "Xuất PDF" im lặng luôn, bấm mãi
  // không ra file và cũng không báo lỗi gì.
  var minDpi = 99999;
  CASE_PHOTOS.forEach(function (p, idx) {
    if (idx > 0) pdf.addPage();
    var iw = p.w, ih = p.h;
    minDpi = Math.min(minDpi, estimateDpi(iw, ih));
    var maxW = pageW - margin * 2, maxH = pageH - margin * 2;
    var scale = Math.min(maxW / iw, maxH / ih);
    var w = iw * scale, h = ih * scale;
    var x = (pageW - w) / 2, y = (pageH - h) / 2;
    pdf.addImage(p.dataUrl, 'JPEG', x, y, w, h);
  });

  var nameInput = document.getElementById('caseNameInput').value.trim();
  var stamp = new Date();
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var autoName = 'ca_' + stamp.getFullYear() + pad(stamp.getMonth() + 1) + pad(stamp.getDate()) + '_' + pad(stamp.getHours()) + pad(stamp.getMinutes()) + pad(stamp.getSeconds());
  var fileName = (nameInput || autoName).replace(/[\\\/:*?"<>|]/g, '_') + '.pdf';
  var pdfBlob = pdf.output('blob');

  sessionExportCount++;
  document.getElementById('sessionCounter').textContent = 'Đã xuất ' + sessionExportCount + ' ca trong phiên này';
  var pages = CASE_PHOTOS.length;
  CASE_PHOTOS = [];
  document.getElementById('caseNameInput').value = '';
  renderThumbs();
  openSaveModal(pdfBlob, fileName, pages, minDpi);
});

// ------------------------------------------------------------
// HỎI LƯU VÀO ĐÂU — CamScanner cho chia sẻ thẳng vào 1 thư mục Drive, còn tải trực tiếp thì không
// tìm thấy file trên điện thoại. "Chia sẻ..." dùng đúng bảng chia sẻ có sẵn của điện thoại
// (Android/Chrome) — trong đó có sẵn lựa chọn "Drive", "Zalo", "Gmail"... y hệt cách CamScanner
// làm, không cần tự viết kết nối riêng tới Google Drive. "Tải về máy" giữ làm phương án dự phòng
// cho máy tính hoặc trình duyệt không hỗ trợ Chia sẻ.
// ------------------------------------------------------------
var saveModal, saveModalFileName;
function ensureSaveModal() {
  if (saveModal) return;
  saveModal = document.createElement('div');
  saveModal.className = 'modal-overlay';
  saveModal.style.alignItems = 'center';
  saveModal.style.justifyContent = 'center';
  saveModal.innerHTML =
    '<div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:340px;width:88%;text-align:center;">' +
    '<div style="font-size:15px;font-weight:600;margin-bottom:4px;">Đã tạo xong file PDF</div>' +
    '<div id="saveModalFileName" style="font-size:12px;color:var(--muted);margin-bottom:6px;word-break:break-all;"></div>' +
    '<div id="saveModalQuality" style="font-size:11px;color:var(--muted);margin-bottom:16px;"></div>' +
    '<button class="btn btn-primary" id="btnSaveShare" style="width:100%;margin-bottom:10px;">📤 Chia sẻ / Lưu vào Drive...</button>' +
    '<button class="btn btn-secondary" id="btnSaveDownload" style="width:100%;margin-bottom:10px;">⬇ Tải về máy</button>' +
    '<button class="btn btn-secondary" id="btnSaveClose" style="width:100%;background:none;border:none;color:var(--muted);">Đóng, chụp ca tiếp theo</button>' +
    '</div>';
  document.body.appendChild(saveModal);
  document.getElementById('btnSaveClose').addEventListener('click', function () { saveModal.classList.remove('show'); });
}

function openSaveModal(pdfBlob, fileName, pages, minDpi) {
  ensureSaveModal();
  saveModalFileName = fileName;
  document.getElementById('saveModalFileName').textContent = fileName;
  var q = document.getElementById('saveModalQuality');
  q.textContent = pages + ' trang · ' + (pdfBlob.size / 1048576).toFixed(1) + ' MB · trang mờ nhất ~' + minDpi + ' DPI';
  q.style.color = minDpi < 150 ? 'var(--warn)' : 'var(--muted)';

  var btnShare = document.getElementById('btnSaveShare');
  var canShareFile = false;
  try {
    var testFile = new File([pdfBlob], fileName, { type: 'application/pdf' });
    canShareFile = !!(navigator.canShare && navigator.canShare({ files: [testFile] }));
  } catch (e) { canShareFile = false; }
  btnShare.style.display = canShareFile ? 'block' : 'none';
  btnShare.onclick = function () {
    try {
      var file = new File([pdfBlob], fileName, { type: 'application/pdf' });
      navigator.share({ files: [file], title: fileName }).then(function () {
        saveModal.classList.remove('show');
      }).catch(function (err) {
        if (err && err.name === 'AbortError') return; // tự bấm huỷ trên bảng chia sẻ, không phải lỗi
        showToast('Chia sẻ lỗi: ' + (err && err.name ? err.name + ' - ' : '') + (err && err.message ? err.message : err) + '. Thử "Tải về máy" thay thế.', 6000);
      });
    } catch (e) {
      showToast('Chia sẻ lỗi ngay khi bấm: ' + (e && e.message ? e.message : e) + '. Thử "Tải về máy" thay thế.', 6000);
    }
  };

  document.getElementById('btnSaveDownload').onclick = function () {
    var url = URL.createObjectURL(pdfBlob);
    var a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    saveModal.classList.remove('show');
  };

  saveModal.classList.add('show');
}

// Khởi động camera ngay khi mở trang.
startCamera(false);
window.addEventListener('resize', function () {
  if (editModal.classList.contains('show')) { layoutEditCanvas(); drawEditCanvas(); }
  resizeOverlayToVideo();
});
</script>
